# Mandala — Next.js + MariaDB (Coolify)
services:
  next:
    build:
      context: .
      dockerfile: Dockerfile.next
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    image: mandala-next:latest
    restart: unless-stopped
    networks:
      - coolify
    ports:
      - "3003:3000"
    environment:
      USE_NODE_API: "true"
      MARIADB_HOST: ${MARIADB_HOST:-mariadb}
      MARIADB_PORT: ${MARIADB_PORT:-3306}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-mandala}
      MARIADB_USER: ${MARIADB_USER:-mariadb}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      DB_PREFIX: ${DB_PREFIX:-mdl_}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-720}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}

networks:
  coolify:
    external: true
